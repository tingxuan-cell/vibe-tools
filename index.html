<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今天吃什麼？</title><meta name="description" content="輸入想吃的餐點，隨機抽選，解決每天的選擇困難。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff653c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='24' fill='white'%3E?%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#fff9f2;color:#29221e;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;font-size:16px}main{max-width:940px;margin:auto;padding:48px 24px}header{margin-bottom:32px}.eyebrow{color:#a13a20;font-weight:700;font-size:14px;letter-spacing:2px}h1{font-size:clamp(32px,6vw,48px);margin:10px 0}header p{color:#67594e;line-height:1.7} .layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:white;border:1px solid #eaded1;border-radius:24px;padding:28px;box-shadow:0 8px 30px #563c1710}label,h2{font-size:20px;font-weight:700;display:block;margin:0 0 12px}.hint{font-size:14px;color:#77675a;margin:0 0 14px}textarea{width:100%;height:240px;resize:vertical;border:1px solid #bfae9e;border-radius:12px;padding:16px;font:inherit;line-height:1.8;background:#fffdf9}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;font-weight:700}button:focus-visible,textarea:focus-visible{outline:3px solid #2361aa;outline-offset:3px}.primary{background:#c94120;color:white;width:100%;margin-top:18px}.primary:hover{background:#a93013}button:disabled{opacity:.65;cursor:wait}.secondary{background:#f1e9df;color:#493c30;font-size:14px;padding:10px 14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.count{font-size:14px;color:#67594e}.result-panel{position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:center;background:#ffeedb}.badge{align-self:center;border:1px solid #dba887;border-radius:30px;padding:6px 14px;font-size:14px;color:#9b371c}.result{flex:1;display:flex;align-items:center;justify-content:center;min-height:210px;overflow-wrap:anywhere;font-size:36px;font-weight:800;line-height:1.5}.status{min-height:24px;font-size:14px;color:#884326;margin:0;line-height:1.7}.history{margin-top:24px;box-shadow:none}.history-head{display:flex;justify-content:space-between;align-items:center}.history h2{margin:0}.history ol{padding-left:24px;line-height:1.9}.history li{padding-left:6px;overflow-wrap:anywhere}.time{font-size:14px;color:#77675a;margin-left:12px}.empty{color:#77675a;font-size:14px}footer{text-align:center;color:#77675a;font-size:14px;margin-top:24px}@media(max-width:640px){main{padding:28px 16px}.layout{grid-template-columns:1fr}.panel{padding:22px}.result{min-height:150px}textarea{height:180px}}@media(prefers-reduced-motion:no-preference){.rolling{animation:pulse .25s infinite alternate}@keyframes pulse{to{opacity:.45;transform:scale(.96)}}}

.result.reveal{animation:reveal .65s cubic-bezier(.2,.8,.3,1.3)}
@keyframes reveal{0%{opacity:.1;transform:scale(.55) rotate(-5deg)}65%{opacity:1;transform:scale(1.15) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.confetti{position:absolute;top:40%;left:50%;width:9px;height:15px;pointer-events:none;animation:confetti 1.1s ease-out forwards}
@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){.result.reveal{animation:none}.confetti{display:none}}

#drawModal{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:#211811aa;backdrop-filter:blur(5px)}
#drawModal[hidden]{display:none}
#drawModal .modal-panel{width:min(440px,100%);max-height:85dvh;overflow:auto;background:#ffeedb;border:2px solid #e3b799;border-radius:24px;box-shadow:0 24px 90px #0006;animation:popup .3s ease-out}
@keyframes popup{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-panel{position:relative;overflow:hidden;text-align:center;padding:32px 24px}.modal-panel .badge{display:inline-block}.modal-panel .result{min-height:180px}.modal-panel .primary{margin-top:12px}
</style></head><body><main><header><span class="eyebrow">每日最難的決定</span><h1>今天吃什麼？</h1><p>把想吃的寫下來，讓今天的那一餐有個答案。</p></header><div class="layout"><section class="panel"><label for="foods">你的餐點候選名單</label><p class="hint" id="inputHint">一行一個餐點，重複名稱只計算一次。</p><textarea id="foods" aria-describedby="inputHint" placeholder="例如：&#10;牛肉麵&#10;水餃&#10;火鍋">牛肉麵
水餃
火鍋
咖哩飯
義大利麵</textarea><div class="row"><span class="count" id="count"></span><button class="secondary" id="reset" type="button">清空名單</button></div><button class="primary" id="draw" type="button">幫我決定！</button></section><section class="panel result-panel" aria-label="抽選結果"><span class="badge">這一餐，就吃</span><div class="result" id="result">等你按下抽選</div><p class="status" id="status" role="status" aria-live="polite">每個餐點都有相同的中選機率。</p></section></div><section class="panel history"><div class="history-head"><h2>抽選紀錄</h2><button class="secondary" id="clear" type="button">清除紀錄</button></div><p class="empty" id="empty">還沒有紀錄，先抽一次吧！</p><ol id="history"></ol></section><footer>再抽一次也沒關係，吃飯開心最重要。</footer></main><div id="drawModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1" hidden><div class="modal-panel"><h2 id="modalTitle">今天吃什麼？</h2><span class="badge">這一餐，就吃</span><div class="result" id="modalResult">選擇中…</div><p class="status" id="modalStatus" role="status" aria-live="polite">正在幫你決定…</p><button class="primary" id="closeModal" type="button">關閉</button></div></div><script>
const $=id=>document.getElementById(id);const foods=$('foods'),draw=$('draw');let busy=false;let records=[];
function options(){return [...new Set(foods.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))]}
function count(){$('count').textContent=`共 ${options().length} 個餐點`}
function history(){ $('history').replaceChildren();$('empty').hidden=records.length>0;for(const r of records){const li=document.createElement('li');li.textContent=r.name;const time=document.createElement('span');time.className='time';time.textContent=r.time;li.append(time);$('history').append(li)}}
foods.addEventListener('input',count);$('reset').onclick=()=>{foods.value='';count();foods.focus()};$('clear').onclick=()=>{records=[];history()};
const modal=$('drawModal');
function closePopup(){if(busy)return;modal.hidden=true;document.body.style.overflow='';document.querySelector('main').inert=false;draw.focus()}
$('closeModal').onclick=closePopup;
modal.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();closePopup()}if(event.key==='Tab'){event.preventDefault();if(busy)modal.focus();else $('closeModal').focus()}});

function celebrate(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const panel=document.querySelector('.modal-panel');for(let i=0;i<30;i++){const piece=document.createElement('span');piece.className='confetti';piece.setAttribute('aria-hidden','true');piece.style.background=['#ff653c','#ffc23c','#5588e4','#cf54aa'][i%4];piece.style.setProperty('--x',`${(Math.random()-.5)*360}px`);piece.style.setProperty('--y',`${(Math.random()-.35)*300}px`);piece.style.setProperty('--r',`${Math.random()*720}deg`);panel.append(piece);setTimeout(()=>piece.remove(),1200)}}
draw.onclick=()=>{if(busy)return;const list=options();if(!list.length){$('status').textContent='請先輸入至少一個餐點，再開始抽選。';foods.focus();return}busy=true;$('modalResult').classList.remove('reveal');$('modalResult').classList.add('rolling');$('modalResult').textContent='選擇中…';$('modalStatus').textContent='正在幫你決定…';$('closeModal').hidden=true;modal.hidden=false;document.body.style.overflow='hidden';document.querySelector('main').inert=true;modal.focus();$('result').classList.remove('reveal');draw.disabled=true;$('reset').disabled=true;foods.disabled=true;draw.textContent='正在幫你選…';$('status').textContent='選擇中…';$('result').classList.add('rolling');let ticks=0;const timer=setInterval(()=>{$('result').textContent=list[Math.floor(Math.random()*list.length)];$('modalResult').textContent=$('result').textContent;if(++ticks>=18){clearInterval(timer);const name=list[Math.floor(Math.random()*list.length)];$('result').textContent=name;$('result').classList.remove('rolling');$('result').classList.add('reveal');$('modalResult').textContent=name;$('modalResult').classList.remove('rolling');$('modalResult').classList.add('reveal');$('modalStatus').textContent='決定好了，今天就吃這個！';$('closeModal').hidden=false;celebrate();$('closeModal').focus();$('status').textContent=list.length===1?'目前只有一個餐點，就是它啦！':'決定好了！想換一個也可以再抽一次。';records.unshift({name,time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});history();busy=false;draw.disabled=false;$('reset').disabled=false;foods.disabled=false;draw.textContent='再抽一次！'}},80)};count();
</script></body></html>
